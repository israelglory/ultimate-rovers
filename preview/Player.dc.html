      return { label: p[1], on: period === p[0], style: period === p[0] ? on : off, pick: function () { self.setState({ period: p[0] }); } };
    });
    return {
      periods: periods,
      periodNote: period === 'season' ? 'Figures for [2026/27], all competitions. Updated after every match.' : 'Career figures across every club, league and cup.',
      facts: [
        { k: 'Date of birth', v: '[DD Month YYYY]' },
        { k: 'Age', v: '[##]' },
        { k: 'Nationality', v: '[Country]' },
        { k: 'Height', v: '[### cm]' },
        { k: 'Preferred foot', v: '[Right]' },
        { k: 'Joined', v: '[Month YYYY]' },
        { k: 'Previous club', v: '[Club name]' },
        { k: 'Contract until', v: '[YYYY]' }
      ],
      stats: ['Appearances', 'Starts', 'Goals', 'Assists', 'Minutes played', 'Shots on target', 'Yellow cards', 'Red cards'],
      career: [
        { season: '2026/27', club: 'Ultimate Rovers' },
        { season: '2025/26', club: 'Ultimate Rovers' },
        { season: '[YYYY/YY]', club: '[Previous club]' },
        { season: '[YYYY/YY]', club: '[Previous club]' }
      ],
      more: [{ num: '11' }, { num: '17' }, { num: '19' }]
    };
  }

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4200}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var pick = (this.state && this.state.pos) || 'all';
    var data = [
      { key: 'gk', title: 'Goalkeepers', role: 'Goalkeeper', nums: [1, 13, 23] },
      { key: 'df', title: 'Defenders', role: 'Defender', nums: [2, 3, 4, 5, 6, 15] },
      { key: 'mf', title: 'Midfielders', role: 'Midfielder', nums: [7, 8, 10, 14, 16, 18] },
      { key: 'fw', title: 'Forwards', role: 'Forward', nums: [9, 11, 17, 19] }
    ];
    var on = 'min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #5CE1E6; background: #5CE1E6; color: #071341; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer';
    var off = 'min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #3A55B5; background: transparent; color: #ffffff; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer';
    var total = data.reduce(function (n, g) { return n + g.nums.length; }, 0);
    var filters = [{ key: 'all', label: 'All players', count: String(total) }].concat(data.map(function (g) {
      return { key: g.key, label: g.title, count: String(g.nums.length) };
    })).map(function (f) {
      return Object.assign({}, f, { on: pick === f.key, style: pick === f.key ? on : off, pick: function () { self.setState({ pos: f.key }); } });
    });
    var groups = data.filter(function (g) { return pick === 'all' || pick === g.key; }).map(function (g) {
      return {
        title: g.title,
        countLabel: g.nums.length + ' players',
        players: g.nums.map(function (n) { return { num: String(n), role: g.role }; })
      };
    });
    return { filters: filters, groups: groups };
  }
}

</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ultimate Rovers: Home on mobile</title>
<script src="./dc-preview.js"></script>
</head>
<body>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Big+Shoulders+Display:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F7FB}
a{color:#0E2A8C}a:hover{color:#071341}
a:focus-visible,button:focus-visible{outline:3px solid #5CE1E6;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; min-height: 3600px; position: relative; font-family: 'Archivo', system-ui, sans-serif; color: #0A1030; background: #F4F7FB; overflow: hidden">

<header style="background: #071341; color: #ffffff; border-bottom: 3px solid #5CE1E6; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 3">
<a href="Main.dc.html" aria-label="Ultimate Rovers home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #ffffff">
<img src="../assets/crest.png" alt="" style="width: 38px; height: auto">
<span style="font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 22px; line-height: 1">ULTIMATE ROVERS</span>
</a>
<button type="button" onClick="{{toggle}}" aria-expanded="{{open}}" aria-label="{{menuLabel}}" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: #0E2A8C; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{closed}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
</button>
</header>

<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Main" style="position: absolute; top: 63px; left: 0; right: 0; bottom: 0; background: #071341; z-index: 2; padding: 16px 16px 0; display: flex; flex-direction: column">
<a href="Main.dc.html" aria-current="page" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid #1E3383; color: #5CE1E6; text-decoration: none; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 34px">Home</a>
<a href="Fixtures.dc.html" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid #1E3383; color: #ffffff; text-decoration: none; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 34px">Fixtures &amp; results</a>
<a href="Squad.dc.html" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid #1E3383; color: #ffffff; text-decoration: none; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 34px">Squad</a>
<a href="News.dc.html" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid #1E3383; color: #ffffff; text-decoration: none; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 34px">News</a>
<a href="About.dc.html" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid #1E3383; color: #ffffff; text-decoration: none; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 34px">The club</a>
<a href="Stakeholders.dc.html" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid #1E3383; color: #ffffff; text-decoration: none; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 34px">Stakeholders</a>
<a href="Contact.dc.html" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid #1E3383; color: #ffffff; text-decoration: none; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 34px">Contact</a>
<a href="Fixtures.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 24px; background: #5CE1E6; color: #071341; text-decoration: none; font-weight: 700; font-size: 16px; border-radius: 6px">Get tickets</a>
</nav>
</sc-if>

<section style="background: #071341; color: #ffffff; padding: 36px 16px 28px; position: relative; overflow: hidden">
<svg aria-hidden="true" viewBox="0 0 300 300" style="position: absolute; right: -90px; top: 20px; width: 300px; height: auto"><circle cx="150" cy="150" r="130" fill="none" stroke="#5CE1E6" stroke-opacity="0.35" stroke-width="2"></circle><line x1="0" y1="150" x2="300" y2="150" stroke="#5CE1E6" stroke-opacity="0.35" stroke-width="2"></line></svg>
<img src="../assets/crest.png" alt="" style="position: absolute; right: -20px; top: 70px; width: 170px; height: auto; opacity: 0.9">
<div style="position: relative">
<p style="margin: 0 0 12px; color: #5CE1E6; font-weight: 600; font-size: 15px">Official club website</p>
<h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 84px; line-height: 0.84">ULTIMATE<br>ROVERS</h1>
<p style="margin: 18px 0 0; max-width: 240px; color: #C3CDEE; font-size: 16px; line-height: 1.5">Fixtures, results, the squad and every story from the club.</p>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 10px; margin-top: 24px">
<a href="Fixtures.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; background: #5CE1E6; color: #071341; text-decoration: none; font-weight: 700; font-size: 16px; border-radius: 6px">See fixtures</a>
<a href="Squad.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border: 2px solid #ffffff; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 16px; border-radius: 6px; box-sizing: border-box">Meet the squad</a>
</div>
<div style="position: relative; margin-top: 28px; background: #0E2A8C; border-radius: 14px; padding: 18px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<p style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 24px">Next match</p>
<span style="font-size: 13px; color: #C3CDEE">[Competition]</span>
</div>
<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 16px; text-align: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><img src="../assets/crest.png" alt="" style="width: 44px; height: auto"><span style="font-weight: 700; font-size: 14px">Ultimate Rovers</span></div>
<span style="font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 26px; color: #5CE1E6">[HH:MM]</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; border: 2px dashed #8FA0D8; box-sizing: border-box"></span><span style="font-weight: 700; font-size: 14px">[Opponent FC]</span></div>
</div>
<p style="margin: 14px 0 0; text-align: center; font-size: 14px; color: #E3E9FA">[Sat, DD Month], [Home ground name]</p>
<a href="Fixtures.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 14px; background: #5CE1E6; color: #071341; text-decoration: none; font-weight: 700; font-size: 15px; border-radius: 6px">Buy tickets</a>
</div>
</section>

<section style="padding: 36px 0 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 16px; margin-bottom: 14px">
<h2 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 36px">Recent results</h2>
<a href="Fixtures.dc.html" style="font-weight: 600; font-size: 14px">All</a>
</div>
<div style="display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 8px">
<sc-for list="{{results}}" as="r" hint-placeholder-count="3">
<article style="flex: 0 0 250px; background: #ffffff; border: 1px solid #DCE3EF; border-radius: 12px; padding: 16px">
<p style="margin: 0; font-size: 12px; color: #4A5578">[League], full time</p>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
<img src="../assets/crest.png" alt="Ultimate Rovers" style="width: 36px; height: auto">
<span style="font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 36px; color: #0E2A8C">X : X</span>
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; border: 2px dashed #9AA6C4; box-sizing: border-box"></span>
</div>
<p style="margin: 10px 0 0; font-size: 14px; font-weight: 600">vs {{r}}</p>
</article>
</sc-for>
</div>
</section>

<section style="padding: 28px 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px">
<h2 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 36px">Latest news</h2>
<a href="News.dc.html" style="font-weight: 600; font-size: 14px">All</a>
</div>
<a href="News.dc.html" style="display: block; text-decoration: none; color: #ffffff; background: #0E2A8C; border-radius: 14px; overflow: hidden">
<div aria-hidden="true" style="aspect-ratio: 16 / 9; background: #1B3AA6"></div>
<div style="padding: 16px">
<p style="margin: 0 0 6px; color: #5CE1E6; font-weight: 600; font-size: 13px">Match preview</p>
<h3 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.02">Ultimate Rovers vs [Opponent FC]: everything you need before kick-off</h3>
</div>
</a>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
<sc-for list="{{news}}" as="n" hint-placeholder-count="2">
<a href="News.dc.html" style="display: flex; gap: 12px; align-items: center; text-decoration: none; color: #0A1030; background: #ffffff; border: 1px solid #DCE3EF; border-radius: 12px; padding: 10px">
<div aria-hidden="true" style="flex: 0 0 92px; aspect-ratio: 4 / 3; background: #DCE3EF; border-radius: 8px"></div>
<div><p style="margin: 0 0 4px; color: #0E2A8C; font-weight: 600; font-size: 12px">{{n.cat}}</p><p style="margin: 0; font-weight: 700; font-size: 15px; line-height: 1.3">{{n.title}}</p></div>
</a>
</sc-for>
</div>
</section>

<section style="background: #E6ECF6; padding: 32px 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px">
<h2 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 36px">The squad</h2>
<a href="Squad.dc.html" style="font-weight: 600; font-size: 14px">Full squad</a>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{players}}" as="p" hint-placeholder-count="4">
<a href="Player.dc.html" style="text-decoration: none; color: #0A1030; background: #ffffff; border-radius: 12px; overflow: hidden">
<div style="position: relative; aspect-ratio: 4 / 5; background: #0E2A8C; display: flex; align-items: flex-end; justify-content: center; overflow: hidden">
<span aria-hidden="true" style="position: absolute; top: 4px; left: 10px; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 72px; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px #5CE1E6">{{p.num}}</span>
<svg aria-hidden="true" viewBox="0 0 200 220" style="position: relative; width: 74%; height: auto; display: block"><circle cx="100" cy="72" r="42" fill="#2D4CB8"></circle><path d="M18 220c0-62 36-98 82-98s82 36 82 98z" fill="#2D4CB8"></path></svg>
</div>
<div style="padding: 10px 12px 12px"><p style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 22px; line-height: 1">SURNAME</p><p style="margin: 4px 0 0; color: #4A5578; font-size: 13px">{{p.pos}}</p></div>
</a>
</sc-for>
</div>
</section>

<section style="background: #071341; color: #ffffff; padding: 32px 16px">
<h2 style="margin: 0 0 14px; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 36px">Watch</h2>
<button type="button" aria-label="Play match highlights" style="width: 100%; aspect-ratio: 16 / 9; background: #13277A; border: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<span style="width: 60px; height: 60px; border-radius: 50%; background: #5CE1E6; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#071341"><path d="M8 5v14l11-7z"></path></svg></span>
</button>
<p style="margin: 10px 0 0; font-weight: 700; font-size: 16px">Highlights: Ultimate Rovers vs [Opponent FC]</p>
</section>

<footer style="background: #071341; color: #ffffff; padding: 8px 16px 28px; border-top: 1px solid #1E3383">
<div style="display: flex; align-items: center; gap: 10px; margin-top: 24px">
<img src="../assets/crest.png" alt="" style="width: 44px; height: auto">
<span style="font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 24px">ULTIMATE ROVERS</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; margin-top: 20px">
<a href="Fixtures.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 10px 0">Fixtures</a>
<a href="About.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 10px 0">About us</a>
<a href="Squad.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 10px 0">Squad</a>
<a href="Stakeholders.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 10px 0">Stakeholders</a>
<a href="News.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 10px 0">News</a>
<a href="Contact.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 10px 0">Contact</a>
</div>
<div style="display: flex; gap: 8px; margin-top: 16px">
<a href="https://instagram.com" aria-label="Instagram" style="width: 44px; height: 44px; border-radius: 50%; background: #13277A; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.8"></circle></svg></a>
<a href="https://x.com" aria-label="X" style="width: 44px; height: 44px; border-radius: 50%; background: #13277A; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16M20 4L4 20"></path></svg></a>
<a href="https://youtube.com" aria-label="YouTube" style="width: 44px; height: 44px; border-radius: 50%; background: #13277A; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="4"></rect><path d="M10 9l5 3-5 3z"></path></svg></a>
<a href="https://tiktok.com" aria-label="TikTok" style="width: 44px; height: 44px; border-radius: 50%; background: #13277A; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"></path><path d="M14 3c.5 2.5 2.5 4.5 5 4.5"></path></svg></a>
</div>
<p style="margin: 20px 0 0; font-size: 13px; color: #C3CDEE">© 2026 Ultimate Rovers. All rights reserved.</p>
</footer>
</div>
</script>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":3600}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var open = !!(this.state && this.state.open);
    return {
      open: open,
      closed: !open,
      menuLabel: open ? 'Close menu' : 'Open menu',
      toggle: function () { self.setState({ open: !open }); },
      results: ['[Opponent FC]', '[Opponent FC]', '[Opponent FC]'],
      news: [
        { cat: 'Squad news', title: 'Team news ahead of the [Competition] fixture' },
        { cat: 'Academy', title: 'Open trials for the [Age group] squad return on [Date]' }
      ],
      players: [
        { num: '1', pos: 'Goalkeeper' },
        { num: '4', pos: 'Defender' },
        { num: '8', pos: 'Midfielder' },
        { num: '9', pos: 'Forward' }
      ]
    };
  }
}
</script>
</body>
</html>

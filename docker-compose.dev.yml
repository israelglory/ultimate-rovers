# Local development database only. The app runs on the host with `pnpm dev`.
services:
  db:
    image: postgres:17-alpine
    container_name: ultimate-rovers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rovers
      POSTGRES_PASSWORD: rovers
      POSTGRES_DB: rovers
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - rovers-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rovers -d rovers']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rovers-dev-db:

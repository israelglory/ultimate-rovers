<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ultimate Rovers: Fixtures and results</title>
<script src="./dc-preview.js"></script>
</head>
<body>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Big+Shoulders+Display:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F7FB}
a{color:#0E2A8C}a:hover{color:#071341}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #5CE1E6;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Archivo', system-ui, sans-serif; color: #0A1030; background: #F4F7FB; min-width: 0">

<header style="background: #071341; color: #ffffff; border-bottom: 3px solid #5CE1E6">
<div style="max-width: 1280px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px">
<a href="Main.dc.html" aria-label="Ultimate Rovers home" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #ffffff">
<img src="../assets/crest.png" alt="" style="width: 46px; height: auto; display: block">
<span style="font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: 0.02em">ULTIMATE ROVERS</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px">Home</a>
<a href="Fixtures.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #5CE1E6; text-decoration: none; font-weight: 600; font-size: 15px">Fixtures &amp; results</a>
<a href="Squad.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px">Squad</a>
<a href="News.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px">News</a>
<a href="About.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px">The club</a>
<a href="Stakeholders.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px">Stakeholders</a>
<a href="Contact.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px">Contact</a>
</nav>
<a href="Fixtures.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; background: #5CE1E6; color: #071341; text-decoration: none; font-weight: 700; font-size: 15px; border-radius: 6px">Get tickets</a>
</div>
</header>

<section aria-labelledby="fx-title" style="background: #071341; color: #ffffff; position: relative; overflow: hidden">
<svg aria-hidden="true" viewBox="0 0 600 300" style="position: absolute; right: -80px; top: -40px; width: 600px; height: auto; opacity: 0.35"><circle cx="300" cy="150" r="140" fill="none" stroke="#5CE1E6" stroke-width="2"></circle><line x1="300" y1="0" x2="300" y2="300" stroke="#5CE1E6" stroke-width="2"></line></svg>
<div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 56px 24px 0">
<h1 id="fx-title" style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: clamp(56px, 8vw, 104px); line-height: 0.9">Fixtures &amp; results</h1>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; margin-top: 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="season" style="font-size: 14px; color: #C3CDEE">Season</label>
<select id="season" style="min-height: 46px; padding: 0 14px; border-radius: 6px; border: 1px solid #3A55B5; background: #0E2A8C; color: #ffffff; font: inherit; font-size: 15px; min-width: 180px">
<option>2026/27</option>
<option>2025/26</option>
</select>
</div>
<div role="group" aria-label="Competition" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{comps}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<a href="https://example.com/ultimate-rovers.ics" style="margin-left: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 16px; border: 1px solid #3A55B5; border-radius: 6px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
Sync fixtures to calendar</a>
</div>
<div role="tablist" aria-label="View" style="display: flex; gap: 4px; margin-top: 36px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>
</section>

<div style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 72px">

<sc-if value="{{showFixtures}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 40px">
<sc-for list="{{fixtureMonths}}" as="m" hint-placeholder-count="2">
<section>
<h2 style="margin: 0 0 16px; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 34px">{{m.month}}</h2>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{m.items}}" as="f" hint-placeholder-count="3">
<article style="background: #ffffff; border: 1px solid #DCE3EF; border-radius: 12px; padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<div style="flex: 0 0 72px; text-align: center; background: #071341; color: #ffffff; border-radius: 10px; padding: 10px 0">
<div style="font-size: 13px; color: #C3CDEE">{{f.day}}</div>
<div style="font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 32px; line-height: 1">{{f.dd}}</div>
</div>
<div style="flex: 1 1 170px; display: flex; flex-direction: column; gap: 6px">
<span style="align-self: flex-start; background: #E3F9FA; color: #0A3E6B; font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px">{{f.comp}}</span>
<span style="font-size: 14px; color: #4A5578">{{f.venue}}</span>
</div>
<div style="flex: 3 1 420px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px">
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; text-align: right">
<span style="font-weight: 700; font-size: 17px">{{f.homeName}}</span>
<sc-if value="{{f.homeUs}}" hint-placeholder-val="{{ true }}"><img src="../assets/crest.png" alt="" style="width: 40px; height: auto"></sc-if>
<sc-if value="{{f.awayUs}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; border: 2px dashed #9AA6C4; box-sizing: border-box"></span></sc-if>
</div>
<div style="background: #F4F7FB; border: 1px solid #DCE3EF; border-radius: 8px; padding: 8px 14px; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 26px; color: #0E2A8C">{{f.time}}</div>
<div style="display: flex; align-items: center; gap: 10px">
<sc-if value="{{f.awayUs}}" hint-placeholder-val="{{ false }}"><img src="../assets/crest.png" alt="" style="width: 40px; height: auto"></sc-if>
<sc-if value="{{f.homeUs}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; border: 2px dashed #9AA6C4; box-sizing: border-box"></span></sc-if>
<span style="font-weight: 700; font-size: 17px">{{f.awayName}}</span>
</div>
</div>
<div style="display: flex; gap: 8px; margin-left: auto">
<a href="MatchCentre.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #0E2A8C; color: #0E2A8C; text-decoration: none; font-weight: 700; font-size: 14px; border-radius: 6px">Match centre</a>
<a href="Contact.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; background: #0E2A8C; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 14px; border-radius: 6px">{{f.ticket}}</a>
<button type="button" aria-label="Add to calendar" style="width: 44px; height: 44px; border-radius: 6px; border: 1px solid #DCE3EF; background: #ffffff; color: #0E2A8C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"></path></svg></button>
</div>
</article>
</sc-for>
</div>
</section>
</sc-for>
<sc-if value="{{noFixtures}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 32px; background: #ffffff; border: 1px dashed #B8C3D9; border-radius: 12px; text-align: center; color: #4A5578">No fixtures in this competition yet. Choose All to see the full schedule.</p>
</sc-if>
</div>
</sc-if>

<sc-if value="{{showResults}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{results}}" as="r" hint-placeholder-count="5">
<article style="background: #ffffff; border: 1px solid #DCE3EF; border-radius: 12px; padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<div style="flex: 0 0 72px; text-align: center; background: #E6ECF6; border-radius: 10px; padding: 10px 0">
<div style="font-size: 13px; color: #4A5578">{{r.day}}</div>
<div style="font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 32px; line-height: 1">{{r.dd}}</div>
</div>
<div style="flex: 1 1 170px; display: flex; flex-direction: column; gap: 6px">
<span style="align-self: flex-start; background: #E3F9FA; color: #0A3E6B; font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px">{{r.comp}}</span>
<span style="font-size: 14px; color: #4A5578">Full time</span>
</div>
<div style="flex: 3 1 420px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px">
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px"><span style="font-weight: 700; font-size: 17px">Ultimate Rovers</span><img src="../assets/crest.png" alt="" style="width: 40px; height: auto"></div>
<div style="background: #071341; color: #ffffff; border-radius: 8px; padding: 8px 16px; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 28px">X : X</div>
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; border: 2px dashed #9AA6C4; box-sizing: border-box"></span><span style="font-weight: 700; font-size: 17px">{{r.opp}}</span></div>
</div>
<div style="display: flex; gap: 8px; margin-left: auto">
<a href="MatchCentre.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #0E2A8C; color: #0E2A8C; text-decoration: none; font-weight: 700; font-size: 14px; border-radius: 6px">Match centre</a>
<a href="MatchCentre.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; background: #0E2A8C; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 14px; border-radius: 6px">Highlights</a>
</div>
</article>
</sc-for>
</div>
</sc-if>

<sc-if value="{{showTable}}" hint-placeholder-val="{{ false }}">
<div style="background: #ffffff; border: 1px solid #DCE3EF; border-radius: 12px; padding: 8px 0">
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 15px">
<caption style="text-align: left; padding: 16px 20px; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 28px">[League name] standings</caption>
<thead><tr style="color: #4A5578; text-align: right">
<th scope="col" style="padding: 10px 12px; text-align: left; font-weight: 600">Pos</th><th scope="col" style="padding: 10px 12px; text-align: left; font-weight: 600">Club</th><th scope="col" style="padding: 10px 12px; font-weight: 600">P</th><th scope="col" style="padding: 10px 12px; font-weight: 600">W</th><th scope="col" style="padding: 10px 12px; font-weight: 600">D</th><th scope="col" style="padding: 10px 12px; font-weight: 600">L</th><th scope="col" style="padding: 10px 12px; font-weight: 600">GF</th><th scope="col" style="padding: 10px 12px; font-weight: 600">GA</th><th scope="col" style="padding: 10px 12px; font-weight: 600">GD</th><th scope="col" style="padding: 10px 12px; font-weight: 600">Pts</th><th scope="col" style="padding: 10px 12px; text-align: left; font-weight: 600">Last 5</th>
</tr></thead>
<tbody>
<sc-for list="{{table}}" as="t" hint-placeholder-count="10">
<tr style="{{t.rowStyle}}">
<td style="padding: 12px; text-align: left">{{t.pos}}</td><td style="padding: 12px; text-align: left">{{t.team}}</td><td style="padding: 12px; text-align: right">-</td><td style="padding: 12px; text-align: right">-</td><td style="padding: 12px; text-align: right">-</td><td style="padding: 12px; text-align: right">-</td><td style="padding: 12px; text-align: right">-</td><td style="padding: 12px; text-align: right">-</td><td style="padding: 12px; text-align: right">-</td><td style="padding: 12px; text-align: right; font-weight: 700">-</td>
<td style="padding: 12px"><span style="display: inline-flex; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #DCE3EF"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #DCE3EF"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #DCE3EF"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #DCE3EF"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #DCE3EF"></span></span></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<p style="margin: 0; padding: 14px 20px; font-size: 13px; color: #4A5578; border-top: 1px solid #DCE3EF">Form dots fill in as results come in: navy for a win, mid grey for a draw, outlined for a loss.</p>
</div>
</sc-if>

<section aria-labelledby="tix-title" style="margin-top: 64px">
<h2 id="tix-title" style="margin: 0 0 20px; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 48px; line-height: 1">Tickets and matchday</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<div style="background: #071341; color: #ffffff; border-radius: 12px; padding: 24px">
<h3 style="margin: 0; font-size: 20px">Season tickets</h3>
<p style="margin: 10px 0 18px; color: #C3CDEE; font-size: 15px; line-height: 1.55">Every home league match, priority for cup games. From [Price].</p>
<a href="Contact.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; background: #5CE1E6; color: #071341; text-decoration: none; font-weight: 700; font-size: 14px; border-radius: 6px">Get a season ticket</a>
</div>
<div style="background: #ffffff; border: 1px solid #DCE3EF; border-radius: 12px; padding: 24px">
<h3 style="margin: 0; font-size: 20px">Matchday tickets</h3>
<p style="margin: 10px 0 18px; color: #4A5578; font-size: 15px; line-height: 1.55">On sale [X] days before each home game, online and at the ground. From [Price].</p>
<a href="Contact.dc.html" style="font-weight: 700; font-size: 15px">Ticket prices and gates</a>
</div>
<div style="background: #ffffff; border: 1px solid #DCE3EF; border-radius: 12px; padding: 24px">
<h3 style="margin: 0; font-size: 20px">Getting to the ground</h3>
<p style="margin: 10px 0 18px; color: #4A5578; font-size: 15px; line-height: 1.55">[Home ground name], [Street address]. Parking, transport and accessible entry.</p>
<a href="About.dc.html" style="font-weight: 700; font-size: 15px">Stadium guide</a>
</div>
</div>
</section>
</div>


<footer style="background: #071341; color: #ffffff">
<div style="max-width: 1280px; margin: 0 auto; padding: 64px 24px 32px; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 280px; min-width: 0">
<div style="display: flex; align-items: center; gap: 12px">
<img src="../assets/crest.png" alt="" style="width: 56px; height: auto">
<span style="font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 28px; line-height: 1">ULTIMATE ROVERS</span>
</div>
<p style="margin: 16px 0 0; color: #C3CDEE; font-size: 15px; line-height: 1.6; max-width: 320px">[Short line about the club, its home and the community it plays for.]</p>
<div style="display: flex; gap: 8px; margin-top: 20px">
<a href="https://instagram.com" aria-label="Instagram" style="width: 44px; height: 44px; border-radius: 50%; background: #13277A; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.8"></circle></svg></a>
<a href="https://x.com" aria-label="X" style="width: 44px; height: 44px; border-radius: 50%; background: #13277A; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16M20 4L4 20"></path></svg></a>
<a href="https://youtube.com" aria-label="YouTube" style="width: 44px; height: 44px; border-radius: 50%; background: #13277A; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="4"></rect><path d="M10 9l5 3-5 3z"></path></svg></a>
<a href="https://tiktok.com" aria-label="TikTok" style="width: 44px; height: 44px; border-radius: 50%; background: #13277A; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"></path><path d="M14 3c.5 2.5 2.5 4.5 5 4.5"></path></svg></a>

</div>
</div>
<nav aria-label="Club" style="flex: 0 1 160px; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0 0 8px; font-weight: 700; font-size: 15px">Club</p>
<a href="About.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 6px 0">About us</a>
<a href="Stakeholders.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 6px 0">Stakeholders</a>
<a href="News.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 6px 0">News</a>
<a href="Contact.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 6px 0">Contact</a>
</nav>
<nav aria-label="Matchday" style="flex: 0 1 160px; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0 0 8px; font-weight: 700; font-size: 15px">Matchday</p>
<a href="Fixtures.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 6px 0">Fixtures</a>
<a href="Fixtures.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 6px 0">Results</a>
<a href="Fixtures.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 6px 0">League table</a>
<a href="Squad.dc.html" style="color: #C3CDEE; text-decoration: none; font-size: 15px; padding: 6px 0">Squad</a>
</nav>
<div style="flex: 1 1 300px; min-width: 0">
<p style="margin: 0 0 8px; font-weight: 700; font-size: 15px">Club newsletter</p>
<p style="margin: 0 0 14px; color: #C3CDEE; font-size: 15px; line-height: 1.5">Team news, ticket releases and match reports in your inbox.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<label for="nl-email" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Email address</label>
<input id="nl-email" type="email" placeholder="you@example.com" style="flex: 1 1 200px; min-height: 48px; padding: 0 14px; border-radius: 6px; border: 1px solid #3A55B5; background: #0E2A8C; color: #ffffff; font: inherit; font-size: 15px">
<button type="button" style="min-height: 48px; padding: 0 20px; border: 0; border-radius: 6px; background: #5CE1E6; color: #071341; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer">Subscribe</button>
</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3000}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var tab = s.tab || 'fixtures';
    var comp = s.comp || 'All';
    var chipOn = 'min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #5CE1E6; background: #5CE1E6; color: #071341; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer';
    var chipOff = 'min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #3A55B5; background: transparent; color: #ffffff; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer';
    var tabOn = 'min-height: 52px; padding: 0 24px; border: 0; border-radius: 10px 10px 0 0; background: #F4F7FB; color: #071341; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer';
    var tabOff = 'min-height: 52px; padding: 0 24px; border: 0; border-radius: 10px 10px 0 0; background: transparent; color: #C3CDEE; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer';
    var comps = ['All', 'League', 'Cup', 'Friendly'].map(function (c) {
      return { label: c, on: comp === c, style: comp === c ? chipOn : chipOff, pick: function () { self.setState({ comp: c }); } };
    });
    var tabs = [['fixtures', 'Fixtures'], ['results', 'Results'], ['table', 'Table']].map(function (t) {
      return { label: t[1], on: tab === t[0], style: tab === t[0] ? tabOn : tabOff, pick: function () { self.setState({ tab: t[0] }); } };
    });
    function fx(day, dd, c, homeUs, opp) {
      return {
        day: day, dd: dd, comp: '[' + c + ']', type: c, time: '[HH:MM]',
        homeUs: homeUs, awayUs: !homeUs,
        homeName: homeUs ? 'Ultimate Rovers' : opp, awayName: homeUs ? opp : 'Ultimate Rovers',
        venue: homeUs ? 'Home, [Home ground name]' : 'Away, [Opponent ground]',
        ticket: homeUs ? 'Buy tickets' : 'Away tickets'
      };
    }
    var months = [
      { month: '[Month YYYY]', items: [fx('[Sat]', '[DD]', 'League', true, '[Opponent FC]'), fx('[Wed]', '[DD]', 'Cup', false, '[Opponent FC]'), fx('[Sun]', '[DD]', 'League', false, '[Opponent FC]')] },
      { month: '[Month YYYY]', items: [fx('[Sat]', '[DD]', 'League', true, '[Opponent FC]'), fx('[Tue]', '[DD]', 'Friendly', true, '[Opponent FC]'), fx('[Sat]', '[DD]', 'League', false, '[Opponent FC]')] }
    ];
    var filtered = months.map(function (m) {
      return { month: m.month, items: m.items.filter(function (f) { return comp === 'All' || f.type === comp; }) };
    }).filter(function (m) { return m.items.length > 0; });
    var results = [['League'], ['Cup'], ['League'], ['Friendly'], ['League']]
      .filter(function (r) { return comp === 'All' || r[0] === comp; })
      .map(function (r) { return { day: '[Sat]', dd: '[DD]', comp: '[' + r[0] + ']', opp: '[Opponent FC]' }; });
    var table = [];
    for (var i = 1; i <= 12; i++) {
      var me = i === 3;
      table.push({ pos: String(i), team: me ? 'Ultimate Rovers' : '[Club name]', rowStyle: me ? 'background: #E3F9FA; font-weight: 700; border-top: 1px solid #DCE3EF' : 'border-top: 1px solid #DCE3EF' });
    }
    return {
      comps: comps, tabs: tabs,
      showFixtures: tab === 'fixtures', showResults: tab === 'results', showTable: tab === 'table',
      fixtureMonths: filtered, noFixtures: filtered.length === 0,
      results: results, table: table
    };
  }
}

</script>

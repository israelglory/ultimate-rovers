<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2900}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var cat = (this.state && this.state.cat) || 'All news';
    var on = 'min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #5CE1E6; background: #5CE1E6; color: #071341; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer';
    var off = 'min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #3A55B5; background: transparent; color: #ffffff; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer';
    var cats = ['All news', 'Match reports', 'Squad news', 'Club', 'Academy', 'Community'].map(function (c) {
      return { label: c, on: cat === c, style: cat === c ? on : off, pick: function () { self.setState({ cat: c }); } };
    });
    var all = [
      { cat: 'Match reports', title: 'Ultimate Rovers X : X [Opponent FC]: the talking points' },
      { cat: 'Squad news', title: '[Player name] signs a new contract until [YYYY]' },
      { cat: 'Club', title: 'Season ticket renewals open for [2026/27]' },
      { cat: 'Academy', title: 'Open trials for the [Age group] squad return on [Date]' },
      { cat: 'Community', title: 'Rovers players visit [School or community group]' },
      { cat: 'Squad news', title: 'Injury update ahead of the [Competition] fixture' },
      { cat: 'Match reports', title: '[Opponent FC] X : X Ultimate Rovers: the head coach’s verdict' },
      { cat: 'Club', title: 'Welcoming [Partner name] as an official partner' },
      { cat: 'Community', title: 'Coaching clinic returns to [Venue] this [Month]' }
    ];
    var articles = all.filter(function (a) { return cat === 'All news' || a.cat === cat; });
    return { cats: cats, articles: articles, empty: articles.length === 0 };
  }
}

</script>
